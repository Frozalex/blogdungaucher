function textBox(text,x,y,width,height,{size=72,min=40,bold=true,color=C.ink,local=9,leading=1.2}={}){let lines=linesFor(text,size,width,bold);while((lines.length*size*leading>height||lines.some(line=>{font(size,bold);return ctx.measureText(line).width>width}))&&size>min){size--;lines=linesFor(text,size,width,bold)}if(lines.length*size*leading>height+1)issues.push('Vertical overflow: '+text);lines.forEach((s,i)=>{const p=ease((local-i*.055)/.5);ctx.save();ctx.globalAlpha*=p;txt(s,x,y+i*size*leading+(1-p)*24,size,color,bold);ctx.restore()});return lines.length*size*leading}

 line(90,1256,990,1256,C.line);if(index===1){photo(330,1320,585,390,l-.3);txt('01',90,1350,50,C.accent,true);textBox('LIRE\nLE CONTEXTE',90,1435,220,155,{size:28,min:26,local:l-1,color:C.muted})}else{geometry(90,1325,390,340,l);textBox('Les nuances\nfont partie\nde l’idée.',545,1410,410,235,{size:43,min:37,local:l-.6,color:C.muted})}}

 const p=ease((l-1)/1);round(90,1607,900,5,2,C.line);round(90,1607,900*clamp(l/s.duration),5,2,C.accent);txt('LE DOSSIER DÉVELOPPE CE POINT',90,1653,22,C.muted,true)
}

window.renderAt=function(t){issues=[];t=Math.max(0,Math.min(t,total-.00001));const index=card.scenes.findIndex(s=>t<s.start+s.duration),s=card.scenes[index],local=t-s.start;ctx.globalAlpha=1;ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);header(t,index);const enter=ease(local/.4),exit=clamp((s.duration-local)/.23);ctx.save();ctx.globalAlpha=enter*exit;ctx.translate(0,(1-enter)*22);if(s.kind==='cover')renderCover(s,local);else if(s.kind==='end')renderEnd(s,local);else if(s.kind==='focus')renderFocus(s,local,index);else renderReading(s,local,index);ctx.restore();return {index,local,overflow:issues.length>0,issues}};

const exporting=new URLSearchParams(location.search).has('export');if(exporting)document.documentElement.classList.add('export');
