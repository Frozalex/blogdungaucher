<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Before interpreting a reaction</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Before interpreting a reaction</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Observation</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A phrase, a gesture</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A context to describe</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Hypothesis</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Several explanations</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Evidence to look for</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Limit</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">No diagnosis</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">From a single event</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Visible behaviour alone does not reveal its psychological function.</text></svg>
