<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Offering a conversation after the game</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Offering a conversation after the game</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Ask</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Talk now?</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Or take a breather?</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Listen</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The player’s experience</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Without rushing to conclude</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Agree</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">When to analyse?</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">What help is wanted?</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">An example response to adapt to the person and context.</text></svg>
