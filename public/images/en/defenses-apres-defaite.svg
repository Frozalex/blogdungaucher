<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">A review after a loss</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">A review after a loss</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Describe</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The critical position</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The choice made</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Acknowledge</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The disappointment felt</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Without judging the person</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Work</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A variation to revisit</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">An achievable goal</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">A suggestion for personal reflection, without diagnostic value.</text></svg>
