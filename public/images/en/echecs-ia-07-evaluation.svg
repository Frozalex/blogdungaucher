<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Evaluating a position at limited depth</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Evaluating a position at limited depth</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Search</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Explore variations</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Set a computing limit</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Evaluation</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Estimate leaf values</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Exact value if known</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Decision</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Back up scores</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Compare candidates</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">A heuristic evaluation does not prove the game’s theoretical value.</text>
</svg>
