<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">An observed gain has several explanations</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">An observed gain has several explanations</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Change</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Variation between games</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Different opposition</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Practice</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Changed preparation</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Playing conditions</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Expectation</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">An effect to isolate</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">through comparison</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Sequence in time is not enough to establish causation.</text></svg>
