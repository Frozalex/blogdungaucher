<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Distinguishing spatial tasks</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Distinguishing spatial tasks</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Visualisation</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Transform an image</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Follow a movement</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Spatial memory</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Recall a position</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Recognise patterns</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Reasoning</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Compare relationships</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Examine trajectories</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">These examples do not prove general transfer from chess training.</text>
</svg>
