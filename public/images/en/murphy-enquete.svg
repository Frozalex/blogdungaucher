<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Examining an impression of repetition</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Examining an impression of repetition</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Define</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A precise hypothesis</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A criterion set beforehand</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Compare</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Several games</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">And counterexamples</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Adjust</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A method to try</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">An effect to observe</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Repeating an account does not replace comparing situations.</text></svg>
