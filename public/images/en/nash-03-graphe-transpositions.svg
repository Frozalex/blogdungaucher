<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">What information are you representing?</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">What information are you representing?</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Move sequence</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">A path through a tree.</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Each history is distinct.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Position</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Transpositions are possible.</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Side to move and rights.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Draw rules</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Counters and repetitions.</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">History may matter.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">A configuration graph may contain cycles.</text></svg>
