<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Before comparing two results</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Before comparing two results</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Sample size</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">How many games?</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">What uncertainty?</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Context</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Time control and period</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Opponent strength</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Collection</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Cases included or excluded</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Selection criteria</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">A descriptive statistic alone does not demonstrate causation.</text></svg>
