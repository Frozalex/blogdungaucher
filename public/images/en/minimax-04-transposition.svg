<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Two paths can reach the same position</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Two paths can reach the same position</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Path A</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">1.d4 Nf6 2.c4</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">A position reached</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Path B</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">1.c4 Nf6 2.d4</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Same side to move and rights</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Table</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Stored value or bound</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Check the depth</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Reuse also depends on draw rules and the information stored.</text>
</svg>
