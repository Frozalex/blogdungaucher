<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Place each opinion in its context</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Place each opinion in its context</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">The author</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Which authority?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">On what date?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Conditions</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Which game is discussed?</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Which use is considered?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Scope</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Who is being addressed?</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">What effects are documented?</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Different opinions cannot be reduced to one Muslim position.</text>
</svg>
