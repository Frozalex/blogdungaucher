<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Returning to a chosen form of play</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Returning to a chosen form of play</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Lighten</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Review the schedule.</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Reduce constraints.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Choose</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">What kind of play?</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">How much time is available?</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Seek support</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Talk with someone.</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Seek help if needed.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Personal options, without a prescribed recovery duration.</text></svg>
