<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Reopening a conclusion after the game</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Reopening a conclusion after the game</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Record</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The critical moment</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Your initial reasoning</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Check</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">The opponent’s replies</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Concrete variations</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Revise</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">What remains valid</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">What needs to change</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">An analysis exercise, not a clinical measure of dissonance.</text></svg>
