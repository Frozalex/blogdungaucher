<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" lang="en"><title id="titre">Tablebases: specify the question and rules</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Tablebases: specify the question and rules</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">DTM</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distance to mate</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Optimising the path</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">DTZ</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distance to a capture</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">or a pawn move</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Rules</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">With or without</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">the 50-move limit?</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Two metrics answer different questions.</text></svg>
