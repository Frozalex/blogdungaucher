<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Examining an explanation of a result</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Examining an explanation of a result</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">After a win</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">What role did choices play?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">The opponent’s role?</text>
<text x="56" y="232" font-family="system-ui,sans-serif" font-size="15" fill="#33382e"> </text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">After a loss</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Use the same framework</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Avoid a global verdict</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Compare</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Review concrete cases</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Look for counterexamples</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">One account of a game does not identify a syndrome.</text>
</svg>
