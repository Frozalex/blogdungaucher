<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-labelledby="t6" lang="en"><title id="t6">Alpha-beta pruning  -  skip branches without changing the value</title>
<rect fill="#e7f5ff" width="400" height="180" />
<text x="200" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#1864ab" font-family="system-ui,sans-serif">Alpha-beta: skip unnecessary work</text>
<line x1="30" y1="90" x2="370" y2="90" stroke="#1971c2" stroke-width="3" />
<line x1="80" y1="50" x2="80" y2="130" stroke="#868e96" stroke-dasharray="6 4" />
<line x1="140" y1="50" x2="140" y2="130" stroke="#868e96" stroke-dasharray="6 4" />
<line x1="220" y1="50" x2="220" y2="130" stroke="#fa5252" stroke-width="2" />
<text x="220" y="45" text-anchor="middle" font-size="10" fill="#c92a2a" font-family="system-ui,sans-serif">cutoff</text>
<text x="200" y="155" text-anchor="middle" font-size="11" fill="#1864ab" font-family="system-ui,sans-serif">Skip branches that cannot improve an available choice</text>
<text x="200" y="172" text-anchor="middle" font-size="10" fill="#495057" font-family="system-ui,sans-serif">Move ordering matters for searching deeper</text>
</svg>
