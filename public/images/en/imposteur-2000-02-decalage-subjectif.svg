<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Rating and experience: two kinds of information</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Rating and experience: two kinds of information</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Results</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Recorded games</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Opposition faced</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Rating</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">System updates</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Variation over time</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Experience</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Confidence or doubt</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Personal interpretation</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Reaching 2000 Elo establishes neither a diagnosis nor a universal psychological threshold.</text>
</svg>
