<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Understanding a piece’s use</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Understanding a piece’s use</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Show</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Recognise its shape</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Hear its name</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Know the game</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Understand the rules</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Recognise a function</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Proposed example</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">A cork replaces</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">a lost knight</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Wittgenstein, §31: showing and naming do not teach the whole use.</text>
</svg>
