<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">Three questions about a decision</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Three questions about a decision</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Game value</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Specified rules</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Perfect-play outcome</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Engine analysis</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Version and search time</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Estimate or proof?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Practical goal</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">A particular opponent</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Time left and risks</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">These model distinctions are not a chess theorem by Nagel.</text>
</svg>
