<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Replies remembered.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Your opponent</text>
