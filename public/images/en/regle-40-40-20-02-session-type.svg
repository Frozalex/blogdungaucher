<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" lang="en"><title id="titre">An example split for one hour</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">An example split for one hour</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Tactics: 24 min</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Solve, then check</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Record your reasoning</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Endgames: 24 min</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Study a position</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Try playing it</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Openings: 12 min</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Review an idea</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Examine your games</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">The 40–40–20 split is a suggestion to adapt, not a validated formula.</text>
</svg>
