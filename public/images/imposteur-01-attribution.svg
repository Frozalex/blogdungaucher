<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Examiner l’explication donnée à un résultat</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Examiner l’explication donnée à un résultat</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Après un gain</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quel rôle pour tes choix ?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Et pour l’adversaire ?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Après une perte</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Même grille d’analyse</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Éviter un verdict global</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Comparer</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Revoir des cas concrets</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Chercher des contre-exemples</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Une manière de commenter une partie ne suffit pas à identifier un syndrome.</text>
</svg>
