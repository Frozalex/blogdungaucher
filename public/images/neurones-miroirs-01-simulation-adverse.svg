<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Trois questions à ne pas confondre</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Trois questions à ne pas confondre</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Geste observé</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Que fait la main ?</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Action motrice</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Action imaginée</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quel coup envisager ?</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Représentation mentale</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Plan stratégique</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quel objectif poursuit-il ?</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Hypothèse à vérifier</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Un lien neuronal entre ces tâches doit être démontré.</text></svg>