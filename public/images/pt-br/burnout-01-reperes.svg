<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Esgotamento esportivo: dimensões para discutir</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Esgotamento esportivo: dimensões para discutir</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Esgotamento</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Recursos percebidos</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">como insuficientes.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Realização</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Sensação de não mais</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">alcançar os objetivos.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Desvalorização</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distância e cinismo</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">em relação à prática.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Estas referências não constituem um teste diagnóstico.</text></svg>