<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Comparar classificações com seu contexto</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Comparar classificações com seu contexto</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Referência</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Sistema de classificação</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Período e ritmo de jogo</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Seleção</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Para quem você olha?</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quem fica fora do relato?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Prática</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comparar decisões</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Definir um objetivo de estudo</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">O Elo não resume o valor da pessoa nem sua experiência de dúvida.</text>
</svg>