<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Distinguir tarefas espaciais</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Distinguir tarefas espaciais</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Visualização</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Transformar uma imagem</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Seguir um deslocamento</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Memória espacial</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Lembrar uma posição</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconhecer padrões</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Raciocínio</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comparar relações</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Examinar trajetórias</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Os exemplos não provam transferência geral do treino de xadrez.</text>
</svg>