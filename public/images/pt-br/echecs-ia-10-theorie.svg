<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">O modelo matemático do xadrez</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">O modelo matemático do xadrez</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Dois jogadores</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Interesses opostos</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Modelo de soma zero</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Informação perfeita</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Estado do jogo visível</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Nenhum sorteio aleatório</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Decisão</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Escolher um lance legal</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Antecipar as respostas</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Informação perfeita não significa conhecer o melhor lance.</text>
</svg>