<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">O que fica visível pode ter sido selecionado</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">O que fica visível pode ter sido selecionado</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Conjunto inicial</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Sucessos e fracassos</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Situações diversas</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Filtro</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Publicação, seleção</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Ou permanência na atividade</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Casos visíveis</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Amostra disponível</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Procurar os ausentes</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Descrever o filtro ajuda a saber a quem se aplica uma conclusão.</text></svg>