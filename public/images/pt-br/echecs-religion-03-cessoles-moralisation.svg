<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Cessoles: o jogo como apoio a uma alegoria</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Cessoles: o jogo como apoio a uma alegoria</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">O tratado</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Uma representação social</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Lições de conduta</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">A circulação</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Cópias e traduções</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Adaptações do relato</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Caxton</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Uma versão inglesa</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Por volta de 1474</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">A difusão de um texto não é uma autorização geral da Igreja.</text>
</svg>