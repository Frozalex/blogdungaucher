<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Compreender o uso de uma peça</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Compreender o uso de uma peça</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Mostrar</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconhecer sua forma</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Ouvir seu nome</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Conhecer o jogo</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Compreender as regras</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconhecer uma função</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Exemplo proposto</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Uma rolha substitui</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">um cavalo perdido</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Wittgenstein, §31: mostrar e nomear não ensinam todo o uso.</text>
</svg>