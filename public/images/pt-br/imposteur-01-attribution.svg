<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Examinar a explicação de um resultado</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Examinar a explicação de um resultado</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Após uma vitória</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qual o papel das escolhas?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qual o papel do adversário</text>
<text x="56" y="232" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Após uma derrota</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Mesma perspectiva de análise</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Evitar um veredito geral</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Comparar</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Rever casos concretos</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Procurar contraexemplos</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Comentar uma partida de certa forma não basta para identificar uma síndrome.</text>
</svg>