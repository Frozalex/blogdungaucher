<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Uma analogia limitada entre planos e respostas</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Uma analogia limitada entre planos e respostas</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Projeto</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Brancas preparam um ataque</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Uma ideia para examinar</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Resposta</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Pretas trocam uma peça</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">As condições mudam</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Revisão</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Rever o projeto</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Calcular possibilidades</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Aplicação editorial: este relato não é uma teoria de xadrez de Hegel.</text>
</svg>