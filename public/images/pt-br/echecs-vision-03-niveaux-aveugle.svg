<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Experimentar a visualização aos poucos</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Experimentar a visualização aos poucos</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Início</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Alguns lances conhecidos</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Depois conferir o tabuleiro</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Variação</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Uma sequência curta ditada</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconstruir a posição</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Adaptação</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Ajustar a dificuldade</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Observar os erros</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Exercícios propostos, sem limite Elo nem benefício universal demonstrado.</text>
</svg>