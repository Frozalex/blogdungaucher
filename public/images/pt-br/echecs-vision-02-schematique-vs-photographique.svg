<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Memória do tabuleiro: além de uma foto mental</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Memória do tabuleiro: além de uma foto mental</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Posição familiar</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Relações entre peças</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Padrões já encontrados</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Representação</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Selecionar referências</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Organizar a informação</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Verificação</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comparar com o tabuleiro</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Anotar peças esquecidas</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Esquema didático: as estratégias de representação variam conforme a tarefa.</text>
</svg>