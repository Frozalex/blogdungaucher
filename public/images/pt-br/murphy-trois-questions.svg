<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Três perguntas sobre um erro</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Três perguntas sobre um erro</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Frequência</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quantos casos?</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Em quantas partidas?</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Gravidade</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Qual vantagem foi perdida?</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quais sequências possíveis?</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Lembrança</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Qual exemplo retorna?</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quais casos são esquecidos?</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Um evento muito marcante não é necessariamente muito frequente.</text></svg>