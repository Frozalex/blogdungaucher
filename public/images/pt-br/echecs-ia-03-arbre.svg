<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Crescimento de uma árvore: definir o modelo</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Crescimento de uma árvore: definir o modelo</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Ramificação</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">b escolhas por nó</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Hipótese simplificadora</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Profundidade</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">d meios-lances estudados</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Cerca de b^d folhas</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Limites</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">b varia com a posição</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">A seleção muda o custo</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Estimar um custo não prova que nenhum método futuro resolverá o jogo.</text>
</svg>