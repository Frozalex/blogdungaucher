<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Apoiar o jogador além do resultado</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Apoiar o jogador além do resultado</text>
