<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Situar cada parecer em seu contexto</title><rect width="900" height="360" rx="20" fill="#faf8ef" />
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Situar cada parecer em seu contexto</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">O autor</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qual autoridade?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Em que data?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">As condições</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">De qual jogo se fala?</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qual uso é discutido?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b" />
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">O alcance</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">A quem se dirige?</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quais efeitos documentados?</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Pareceres diferentes não se reduzem a uma posição muçulmana única.</text>
</svg>