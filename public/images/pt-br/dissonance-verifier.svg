<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre" xml:lang="pt-BR"><title id="titre">Reabrir uma conclusão após a partida</title><rect width="900" height="320" rx="20" fill="#faf8ef" /><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Reabrir uma conclusão após a partida</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Anotar</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">O momento crítico</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Seu raciocínio inicial</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Verificar</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">As respostas adversárias</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">As variantes concretas</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b" /><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Revisar</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">O que continua válido</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">O que precisa mudar</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Exercício de análise, não medida clínica de dissonância.</text></svg>