<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Comparer deux choix avec des hypothèses explicites</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Comparer deux choix avec des hypothèses explicites</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Définir</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Complication ou échange</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quels résultats possibles ?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Estimer</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Probabilités hypothétiques</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Risques pour les deux camps</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Vérifier</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Données et calibration</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Sensibilité aux hypothèses</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Une gaffe adverse n’implique pas automatiquement ta victoire.</text>
</svg>
