<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Avant d’interpréter une réaction</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Avant d’interpréter une réaction</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Observation</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une phrase, un geste</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un contexte à décrire</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Hypothèse</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Plusieurs explications</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Des indices à chercher</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Limite</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Pas de diagnostic</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Sur un seul événement</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Le comportement visible ne révèle pas à lui seul sa fonction psychologique.</text></svg>