<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Face à une contradiction ressentie</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Face à une contradiction ressentie</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Croyance</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Je comprends ce plan</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Je pense avoir bien joué</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Événement</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une défense oubliée</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un résultat décevant</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Réponses possibles</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Réviser, vérifier</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Ou justifier son choix</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Une hypothèse théorique ne permet pas de diagnostiquer une personne à distance.</text></svg>