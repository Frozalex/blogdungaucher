<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Examiner une impression de répétition</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Examiner une impression de répétition</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Définir</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une hypothèse précise</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un critère fixé avant</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Comparer</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Plusieurs parties</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Et les contre-exemples</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Ajuster</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une méthode à essayer</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un effet à observer</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">La répétition d’un récit ne remplace pas la comparaison des situations.</text></svg>