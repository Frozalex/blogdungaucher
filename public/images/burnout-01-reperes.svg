<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Épuisement sportif : des dimensions à discuter</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Épuisement sportif : des dimensions à discuter</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Épuisement</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Ressources ressenties</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">comme insuffisantes.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Accomplissement</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Impression de ne plus</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">atteindre ses objectifs.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Dévalorisation</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distance et cynisme</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">envers la pratique.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Ces repères ne constituent pas un test diagnostique.</text></svg>