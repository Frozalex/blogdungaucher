<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Trois grilles pour analyser le marché des talents</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Trois grilles pour analyser le marché des talents</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Rosen</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Diffusion à grande échelle</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Substitution imparfaite</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Ricardo</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Rente foncière à l’origine</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Analogie à justifier</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Becker</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Formation et compétences</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Rendement incertain</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Modèles explicatifs : une hypothèse doit être confrontée aux données.</text></svg>