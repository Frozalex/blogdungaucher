<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Mémoire du plateau : au-delà d’une photo mentale</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Mémoire du plateau : au-delà d’une photo mentale</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Position familière</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Relations entre pièces</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Motifs déjà rencontrés</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Représentation</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Sélectionner des repères</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Organiser l’information</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Vérification</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comparer au plateau</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Noter les pièces oubliées</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Schéma pédagogique : les stratégies de représentation varient selon la tâche.</text>
</svg>
