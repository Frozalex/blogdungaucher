<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Objets et archives</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">provenance à examiner</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Sélection</text>
