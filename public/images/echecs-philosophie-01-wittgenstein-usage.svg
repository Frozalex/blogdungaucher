<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Comprendre l’usage d’une pièce</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Comprendre l’usage d’une pièce</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Montrer</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconnaître sa forme</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Entendre son nom</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Connaître le jeu</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comprendre les règles</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Reconnaître une fonction</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Exemple proposé</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Un bouchon remplace</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">un cavalier perdu</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Wittgenstein, §31 : montrer et nommer ne suffisent pas à enseigner tout l’usage.</text>
</svg>
