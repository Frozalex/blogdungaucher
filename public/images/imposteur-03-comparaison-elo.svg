<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Comparer des classements avec leur contexte</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Comparer des classements avec leur contexte</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Repère</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Système de classement</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Période et cadence</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Sélection</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qui regardes-tu ?</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Qui reste hors du récit ?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Pratique</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Comparer des décisions</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Fixer un objectif de travail</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Un Elo ne résume ni la valeur d’une personne ni son expérience du doute.</text>
</svg>
