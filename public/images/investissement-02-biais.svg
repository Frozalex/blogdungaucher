<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Deux travaux sur les décisions financières</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Deux travaux sur les décisions financières</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Kahneman–Tversky</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Choix sous risque</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Point de référence</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Odean</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Transactions observées</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Effet de disposition</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Limite commune</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Aucune preuve ici</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">d’un effet protecteur du jeu</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Connaître les échecs ne suffit pas à démontrer une immunité aux biais.</text></svg>