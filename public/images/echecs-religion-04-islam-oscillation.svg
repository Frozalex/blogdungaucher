<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Situer chaque avis dans son contexte</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Situer chaque avis dans son contexte</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">L’auteur</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quelle autorité ?</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">À quelle date ?</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Les conditions</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quel jeu est visé ?</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quel usage est discuté ?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">La portée</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">À qui s’adresse l’avis ?</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Quels effets documentés ?</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Des avis différents ne peuvent pas être ramenés à une position musulmane unique.</text>
</svg>
