<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="tj1">
  <title id="tj1">Arbre minimax à deux demi-coups : le joueur MAX choisit la branche qui maximise le résultat, en anticipant que l'adversaire MIN minimisera à son tour. Ici MAX obtient 3.</title>
  <rect width="640" height="340" fill="#faf8ef"/>
  <text x="320" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1c1a16">Chacun optimise à son tour : MAX anticipe MIN</text>

  <!-- edges -->
  <g stroke="#b7b0a3" stroke-width="1.6" fill="none">
    <line x1="320" y1="72" x2="455" y2="178"/>
    <line x1="455" y1="178" x2="398" y2="286"/>
    <line x1="455" y1="178" x2="550" y2="286"/>
    <line x1="185" y1="178" x2="262" y2="286"/>
  </g>
  <!-- chosen path (green) -->
  <g stroke="#3d8b37" stroke-width="3" fill="none">
    <line x1="320" y1="72" x2="185" y2="178"/>
    <line x1="185" y1="178" x2="110" y2="286"/>
  </g>

  <!-- leaves -->
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="110" cy="286" r="20" fill="#eef3e9" stroke="#3d8b37" stroke-width="2.5"/><text x="110" y="291" fill="#2e7d34">3</text>
    <circle cx="262" cy="286" r="20" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/><text x="262" y="291" fill="#6e6a64">5</text>
    <circle cx="398" cy="286" r="20" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/><text x="398" y="291" fill="#6e6a64">2</text>
    <circle cx="550" cy="286" r="20" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/><text x="550" y="291" fill="#6e6a64">9</text>
  </g>

  <!-- MIN nodes -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="185" cy="178" r="24" fill="#fff" stroke="#3d8b37" stroke-width="2.5"/>
    <text x="185" y="183" font-size="16" font-weight="700" fill="#2e7d34">3</text>
    <circle cx="455" cy="178" r="24" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/>
    <text x="455" y="183" font-size="16" font-weight="700" fill="#6e6a64">2</text>
    <text x="118" y="182" text-anchor="end" font-size="12" font-style="italic" fill="#8a8478">MIN</text>
  </g>

  <!-- MAX root -->
  <circle cx="320" cy="72" r="26" fill="#eef3e9" stroke="#3d8b37" stroke-width="3"/>
  <text x="320" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2e7d34">3</text>
  <text x="356" y="70" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#8a8478">MAX (toi)</text>
</svg>
