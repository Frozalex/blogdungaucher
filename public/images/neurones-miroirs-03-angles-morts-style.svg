<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Éviter de projeter ton propre style</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Éviter de projeter ton propre style</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Préférence</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Le coup que tu jouerais</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">n’est qu’un candidat</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Autres réponses</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Prises, échecs, menaces</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Défenses et échanges</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Contrôle</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Le plateau et le calcul</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">départagent les idées</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">L’intention supposée ne remplace pas la vérification des variantes.</text></svg>