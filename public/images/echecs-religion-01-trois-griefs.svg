<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Des motifs de critique à situer dans leur contexte</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Des motifs de critique à situer dans leur contexte</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Le pari</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Enjeu d’argent</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Pratiques associées</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Les obligations</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Temps consacré au jeu</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Devoirs religieux</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">La conduite</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Colère et rivalité</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Jugement des moralistes</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Ces motifs ne constituent pas une doctrine commune à toutes les traditions.</text>
</svg>
