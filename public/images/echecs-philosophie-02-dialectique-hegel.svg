<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Une analogie limitée entre plans et réponses</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Une analogie limitée entre plans et réponses</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Projet</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Blanc prépare une attaque</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Une idée à examiner</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Réponse</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Noir échange une pièce</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Les conditions changent</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Révision</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Revoir le projet</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Calculer les possibilités</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Application éditoriale : ce récit n’est pas une théorie des échecs de Hegel.</text>
</svg>
