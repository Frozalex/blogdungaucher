<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Deux expériences à distinguer</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Deux expériences à distinguer</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">2017</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">100 parties.</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une minute par coup.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Score 2017</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">28 gains, 72 nulles.</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">64 points sur 100.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">2018</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">1 000 parties.</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">3 heures + 15 s par coup.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Un résultat dépend des versions, du matériel et de la cadence.</text></svg>