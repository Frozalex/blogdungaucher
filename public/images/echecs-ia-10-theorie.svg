<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Le cadre mathématique des échecs</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Le cadre mathématique des échecs</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Deux joueurs</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Intérêts opposés</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Modèle à somme nulle</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Information parfaite</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">État du jeu visible</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Aucun tirage aléatoire</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Décision</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Choisir un coup légal</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Anticiper les réponses</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Information parfaite ne signifie pas connaissance de la meilleure stratégie.</text>
</svg>
