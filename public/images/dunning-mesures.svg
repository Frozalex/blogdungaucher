<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Trois mesures à ne pas confondre</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Trois mesures à ne pas confondre</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Classement observé</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Résultats enregistrés</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Dans un système donné</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Niveau revendiqué</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Autoévaluation du joueur</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Au moment de l’enquête</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Suivi ultérieur</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Classement atteint</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Après une période définie</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">L’écart moyen d’un échantillon ne décrit pas chaque joueur individuellement.</text></svg>