<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Quelle information représentes-tu ?</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Quelle information représentes-tu ?</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Suite de coups</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un chemin dans un arbre.</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Chaque historique est distinct.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Position</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Transpositions possibles.</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Trait et droits à préciser.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Règles de nulle</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Compteurs et répétitions.</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">L’historique peut compter.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Un graphe de configurations peut contenir des cycles.</text></svg>