<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Zugzwang : comparer les résultats</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Zugzwang : comparer les résultats</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Passage hypothétique</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Quel résultat pourrait</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">être conservé ?</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Coup obligatoire</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Chaque coup légal</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">détériore ce résultat</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">À distinguer</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Gain vers nulle</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">ou nulle vers défaite</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Mutuel ou réciproque : l’obligation de jouer désavantage les deux camps.</text></svg>