<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Trois questions sur une décision</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Trois questions sur une décision</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Valeur du jeu</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Règles précisées</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Résultat sous jeu parfait</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Analyse de moteur</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Version et temps de calcul</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Estimation ou preuve ?</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Objectif pratique</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Adversaire particulier</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Temps restant et risques</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Ces distinctions de modèles ne sont pas un théorème échiquéen de Nagel.</text>
</svg>
