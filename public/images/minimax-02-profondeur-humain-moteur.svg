<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Calcul : une analogie à préciser</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Calcul : une analogie à préciser</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Arbre défini</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Coups et réponses légaux.</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Profondeur explicitée.</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Évaluation</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Utilité terminale exacte.</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Estimation à la coupure.</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Joueur humain</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Choix des candidats.</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Profondeur variable.</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Aucune profondeur fixe n’est déduite du classement Elo.</text></svg>