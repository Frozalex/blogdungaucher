<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Tablebases : préciser la question et les règles</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Tablebases : préciser la question et les règles</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">DTM</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distance au mat</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Optimisation du chemin</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">DTZ</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Distance à une prise</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">ou un mouvement de pion</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Règles</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Avec ou sans limite</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">des 50 coups ?</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Deux métriques ne répondent pas à la même question.</text></svg>