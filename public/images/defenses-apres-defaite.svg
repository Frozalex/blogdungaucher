<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Un retour après la défaite</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Un retour après la défaite</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Décrire</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">La position critique</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Le choix effectué</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Reconnaître</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">La déception ressentie</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Sans juger la personne</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Travailler</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Une variante à revoir</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un objectif accessible</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Proposition de réflexion personnelle, sans valeur diagnostique.</text></svg>