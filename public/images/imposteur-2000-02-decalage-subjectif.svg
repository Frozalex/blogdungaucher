<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Résultats</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Parties enregistrées</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Opposition rencontrée</text>
