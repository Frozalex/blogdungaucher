<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Classement et expérience : deux informations</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
