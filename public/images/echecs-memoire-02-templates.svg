<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="tm2">
  <title id="tm2">Le modèle des templates de Gobet et Simon (1996) : un noyau stable (structure de pions, plan typique) entoure des emplacements variables où les pièces changent d'une position à l'autre, permettant à un grand maître de réutiliser des familles de motifs plutôt que de mémoriser des positions isolées.</title>
  <rect width="640" height="360" fill="#faf8ef"/>
  <text x="320" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1c1a16">Templates de Gobet &amp; Simon (1996) : noyau + emplacements variables</text>

  <!-- template card left -->
  <rect x="60" y="55" width="220" height="260" rx="8" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/>
  <text x="170" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8478">TEMPLATE : Roque espagnol</text>

  <!-- noyau stable zone -->
  <rect x="78" y="92" width="184" height="110" rx="5" fill="#eef3e9" stroke="#3d8b37" stroke-width="1.8"/>
  <text x="170" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2e7d34">Noyau stable</text>
  <text x="170" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#1c1a16">♙ e4 · ♙ d3 · ♗ b3</text>
  <text x="170" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#1c1a16">♔ g1 · ♖ f1 · ♖ e1</text>
  <text x="170" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">structure invariante entre variantes</text>
  <text x="170" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">≈ 5 000 – 10 000 chunks</text>

  <!-- emplacements variables zone -->
  <rect x="78" y="214" width="184" height="84" rx="5" fill="#e8f1f8" stroke="#5b9fd4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="170" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b9fd4">Emplacements variables</text>
  <text x="170" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">Cavalier : d4 / f3 / e2 …</text>
  <text x="170" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">Dame : e2 / d2 / f3 …</text>
  <text x="170" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">→ adaptation à la variante réelle</text>

  <!-- chunk card (old model) right -->
  <rect x="360" y="55" width="220" height="260" rx="8" fill="#fff" stroke="#c9c2b4" stroke-width="1.6"/>
  <text x="470" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8478">Modèle des chunks (1973)</text>
  <text x="470" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6e6a64">Positions stockées</text>
  <text x="470" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6e6a64">de façon isolée</text>
  <circle cx="420" cy="160" r="18" fill="#fff" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="420" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9b9384">P1</text>
  <circle cx="470" cy="155" r="18" fill="#fff" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="470" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9b9384">P2</text>
  <circle cx="520" cy="162" r="18" fill="#fff" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="520" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9b9384">P3</text>
  <circle cx="440" cy="215" r="18" fill="#fff" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="440" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9b9384">P4</text>
  <circle cx="500" cy="212" r="18" fill="#fff" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="500" y="217" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9b9384">P5</text>
  <text x="470" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">~50 000 chunks indépendants</text>
  <text x="470" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">requis (Simon &amp; Chase)</text>
  <text x="470" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c9a24b">Limite : pas de généralisation</text>

  <!-- arrow between cards -->
  <line x1="288" y1="185" x2="352" y2="185" stroke="#c9a24b" stroke-width="2" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#c9a24b"/>
    </marker>
  </defs>
  <text x="320" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c9a24b">raffiné en</text>
  <text x="320" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c9a24b">1996</text>

  <!-- bottom caption -->
  <text x="320" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8a8478">Un grand maître réutilise des familles, pas 100 000 positions indépendantes.</text>
