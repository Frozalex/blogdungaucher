<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="titre"><title id="titre">Soutenir le joueur au-delà du résultat</title><rect width="900" height="320" rx="20" fill="#faf8ef"/><text x="40" y="48" font-family="Georgia,serif" font-size="25" fill="#252820">Soutenir le joueur au-delà du résultat</text>
<rect x="40" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="58" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Disponibilité</text>
<text x="58" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Un cadre connu</text>
<text x="58" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Des échanges possibles</text>
<rect x="325" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="343" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Accueil</text>
<text x="343" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Écouter la difficulté</text>
<text x="343" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Éviter l’humiliation</text>
<rect x="610" y="85" width="250" height="155" rx="12" fill="#edf2e7" stroke="#64734b"/><text x="628" y="119" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#33432c">Exploration</text>
<text x="628" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Essayer une idée</text>
<text x="628" y="177" font-family="system-ui,sans-serif" font-size="16" fill="#33382e">Accepter de se tromper</text>
<text x="40" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#5d6555">Grille de réflexion : ces comportements ne constituent pas un test d’attachement.</text></svg>