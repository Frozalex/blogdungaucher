<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="tm1">
  <title id="tm1">Nombre de pièces correctement replacées par un novice et un grand maître, selon que la position est réelle ou aléatoire (Chase et Simon, 1973)</title>
  <rect width="640" height="340" fill="#faf8ef"/>
  <text x="320" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#1c1a16">Pièces replacées après 5 secondes d'observation</text>

  <!-- axes -->
  <line x1="70" y1="285" x2="610" y2="285" stroke="#444" stroke-width="1.2"/>
  <line x1="70" y1="70" x2="70" y2="285" stroke="#444" stroke-width="1.2"/>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6e6a64">
    <text x="62" y="289" text-anchor="end">0</text>
    <text x="62" y="220" text-anchor="end">10</text>
    <text x="62" y="151" text-anchor="end">20</text>
    <text x="62" y="90" text-anchor="end">28</text>
    <line x1="66" y1="285" x2="70" y2="285" stroke="#444"/>
    <line x1="66" y1="216" x2="70" y2="216" stroke="#444"/>
    <line x1="66" y1="147" x2="70" y2="147" stroke="#444"/>
    <line x1="66" y1="86" x2="70" y2="86" stroke="#444"/>
  </g>

  <!-- bars: baseline y=285, scale 6.86 px / pièce -->
  <!-- Position réelle -->
  <rect x="120" y="257" width="70" height="28" fill="#9b9384"/>
  <rect x="205" y="93" width="70" height="192" fill="#3d8b37"/>
  <!-- Position aléatoire -->
  <rect x="365" y="257" width="70" height="28" fill="#9b9384"/>
  <rect x="450" y="251" width="70" height="34" fill="#3d8b37"/>

  <!-- value labels -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="155" y="248" fill="#6b665e">4</text>
    <text x="240" y="84" fill="#2e7d34">28</text>
    <text x="400" y="248" fill="#6b665e">4</text>
    <text x="485" y="242" fill="#2e7d34">5</text>
  </g>

  <!-- group labels -->
  <g font-family="Georgia, serif" font-size="13" fill="#1c1a16" text-anchor="middle">
    <text x="197" y="306">Position réelle de partie</text>
    <text x="442" y="306">Position aléatoire</text>
  </g>

  <!-- legend -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#3a3630">
    <rect x="330" y="44" width="13" height="13" fill="#9b9384"/>
    <text x="349" y="55">Novice</text>
    <rect x="420" y="44" width="13" height="13" fill="#3d8b37"/>
    <text x="439" y="55">Grand maître</text>
  </g>
</svg>
