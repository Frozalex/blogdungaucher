<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="titre"><title id="titre">Décrire une difficulté avant de la nommer</title><rect width="900" height="360" rx="20" fill="#faf8ef"/>
<text x="40" y="38" font-family="Georgia,serif" font-size="23" fill="#252820">Décrire une difficulté avant de la nommer</text>
<rect x="40" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Observation</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Une phrase prononcée</text>
<text x="56" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Une situation précise</text>
<rect x="325" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="341" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Interprétation</text>
<text x="341" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Plusieurs hypothèses</text>
<text x="341" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Pas de test à cinq signes</text>
<rect x="610" y="100" width="250" height="170" rx="12" fill="#edf2e7" stroke="#64734b"/>
<text x="626" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#33432c">Échange</text>
<text x="626" y="190" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Demander le vécu</text>
<text x="626" y="211" font-family="system-ui,sans-serif" font-size="15" fill="#33382e">Respecter les différences</text>
<text x="40" y="310" font-family="system-ui,sans-serif" font-size="15" fill="#5d6555">Ces exemples de réflexion ne constituent pas une grille diagnostique validée.</text>
</svg>
