<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Hors ligne — Blog d'un Gaucher</title>
  <style>
    :root {
      --bg: #fcfaf6;
      --surface: #ffffff;
      --text: #211f1a;
      --muted: #6b6557;
      --accent: #3d8b37;
      --border: #e7e1d4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14130f;
        --surface: #1d1b16;
        --text: #f0ece4;
        --muted: #a8a08f;
        --accent: #6fc267;
        --border: #2c2922;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 30rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 16px 40px -24px rgba(0,0,0,0.35);
    }
    .offline-logo {
      width: 3.25rem;
      height: 4.5rem;
      margin: 0 auto 0.75rem;
      background-color: var(--accent);
      -webkit-mask: url("/images/logo.svg") center / contain no-repeat;
      mask: url("/images/logo.svg") center / contain no-repeat;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #c2410c;
      box-shadow: 0 0 0 4px rgba(194,65,12,0.15);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      margin: 0 0 0.6rem;
      letter-spacing: -0.01em;
    }
    p { margin: 0 0 1.4rem; color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 0.65rem; }
    .btn {
      display: inline-block;
      padding: 0.8rem 1.2rem;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn--primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .btn--ghost { background: transparent; color: var(--text); }
    .links {
      margin-top: 1.6rem;
      padding-top: 1.3rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .links span { color: var(--muted); }
    .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="offline-logo" role="img" aria-label="Blog d'un Gaucher"></div>
    <div class="status"><span class="dot"></span> Hors ligne</div>
    <h1>Pas de connexion</h1>
    <p>
      Tu n'es plus connecté à Internet. Les pages que tu as déjà consultées
      restent accessibles hors ligne. La reconnexion rechargera la page
      automatiquement.
    </p>
    <div class="actions">
      <button class="btn btn--primary" onclick="location.reload()">Réessayer</button>
      <a class="btn btn--ghost" href="/fr/">Aller à l'accueil</a>
    </div>
    <div class="links">
      <span>Disponible hors ligne :</span>
      <a href="/fr/">Accueil</a> ·
      <a href="/fr/blog/">Tous les articles</a>
    </div>
  </main>
  <script>
    // Recharge dès le retour de la connexion.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
