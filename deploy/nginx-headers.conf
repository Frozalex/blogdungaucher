# ─────────────────────────────────────────────────────────────────────────────
# En-têtes de sécurité + politique de cache — blogdungaucher.com (nginx)
#
# POURQUOI : l'audit SEO/sécurité (squirrelscan) signalait :
#   - security/csp            : aucun Content-Security-Policy
#   - security/hsts           : aucun Strict-Transport-Security
#   - security/x-frame-options: aucune protection anti-clickjacking
#   - perf/bad-caching        : 25/25 pages sans durée de fraîcheur de cache
#   - perf/cache-headers      : aucun en-tête de cache sur les assets
#
# DÉPLOIEMENT (manuel, une fois) :
#   1) scp deploy/nginx-headers.conf root@177.7.37.62:/etc/nginx/snippets/blog-headers.conf
#   2) dans le server block HTTPS, AVANT le location principal :
#        include /etc/nginx/snippets/blog-headers.conf;
#   3) nginx -t && systemctl reload nginx
#   4) Vérifs :
#        curl -sI https://blogdungaucher.com/ | grep -iE 'strict-transport|content-security|x-frame|x-content-type|referrer'
#        curl -sI https://blogdungaucher.com/_astro/ | head    # (voir Cache-Control immutable)
#
# NB Traefik : si Traefik est en frontal, ces en-têtes peuvent aussi être posés
# via un middleware `headers`. Ici on les pose côté nginx (origin) : ils passent
# tels quels à travers Traefik tant qu'il ne les réécrit pas.
# ─────────────────────────────────────────────────────────────────────────────

# ── En-têtes de sécurité (posés sur TOUTES les réponses, y compris erreurs) ──
# `always` : indispensable pour que l'en-tête accompagne aussi les 301/404.

# HSTS : force HTTPS pendant 2 ans, sous-domaines inclus. Préchargement possible.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Anti-clickjacking : la page ne peut être embarquée que par elle-même.
add_header X-Frame-Options "SAMEORIGIN" always;

# Empêche le MIME-sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Politique de referrer (cohérente avec la meta du site).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Réduit la surface d'API navigateur exposée.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# Content-Security-Policy.
# `unsafe-inline` pour scripts/styles : le site est statique (Astro) avec des
# scripts is:inline (anti-flash dark/i18n, JSON-LD) et AdSense — pas de nonce
# possible sans SSR. Les origines tierces détectées sont listées explicitement.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.google.com https://*.gstatic.com https://stats.blogdungaucher.com https://cdn.jsdelivr.net; connect-src 'self' https://blogdungaucher.com https://stats.blogdungaucher.com https://*.google.com https://pagead2.googlesyndication.com; frame-src https://*.google.com https://googleads.g.doubleclick.net; form-action 'self' https://blogdungaucher.com; upgrade-insecure-requests" always;

# ── Politique de cache ──────────────────────────────────────────────────────

# Assets versionnés Astro (hash dans le nom) : immuables, cache 1 an.
location ^~ /_astro/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  # Ré-inclure les en-têtes de sécurité : un `location` avec add_header
  # écrase ceux du niveau server (règle nginx sur l'héritage de add_header).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

# Images, polices, favicons, PDF : cache long (30 j) avec revalidation.
location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf|mp4|webm)$ {
  add_header Cache-Control "public, max-age=2592000" always;
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

# Pages HTML : cache court côté navigateur, revalidation systématique
# (le contenu peut changer à chaque build/déploiement).
location ~* \.html$ {
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
  add_header X-Content-Type-Options "nosniff" always;
}

# Fichiers de contrôle qui ne doivent pas être mis en cache agressivement.
location ~* ^/(robots\.txt|sitemap\.xml|rss\.xml|manifest\.json)$ {
  add_header Cache-Control "public, max-age=3600" always;
}
