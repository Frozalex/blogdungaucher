# ─────────────────────────────────────────────────────────────────────────────
# En-têtes de sécurité + cache — blogdungaucher.com (nginx, CONTEXTE server)
#
# POURQUOI : l'audit SEO/sécurité (squirrelscan) signalait l'absence de
# Content-Security-Policy, Strict-Transport-Security, X-Frame-Options et de
# politique de cache (perf/bad-caching, perf/cache-headers).
#
# ⚠️ RÈGLE NGINX CRITIQUE : un `location` qui déclare son propre `add_header`
# n'hérite PLUS d'AUCUN add_header du niveau server. On met donc TOUS les
# add_header au niveau server (ici) et AUCUN bloc `location` de cache ; le
# Cache-Control par type passe par un `map` (voir nginx-cache-map.conf), appliqué
# via un unique `add_header Cache-Control $blog_cache_control` en bas de ce fichier.
#
# DÉPLOIEMENT (manuel, une fois) — config réelle du VPS :
#   root /var/www/site/public ; server block : /etc/nginx/sites-available/blogdungaucher.conf
#   1) cp nginx-cache-map.conf /etc/nginx/conf.d/blog-cache-map.conf     (contexte http)
#   2) cp nginx-headers.conf   /etc/nginx/snippets/blog-headers.conf     (contexte server)
#   3) dans le server block HTTPS, après `include .../blog-redirects.conf;` :
#        include /etc/nginx/snippets/blog-headers.conf;
#   4) nginx -t && systemctl reload nginx
#   5) Vérif :
#        curl -sI https://blogdungaucher.com/fr/ | grep -iE 'strict|content-security|x-frame|referrer|permissions'
#        curl -sI https://blogdungaucher.com/images/logo.svg | grep -i cache-control
#
# NB CSP : `'unsafe-inline'` (scripts inline anti-flash / JSON-LD + AdSense, pas de
# nonce possible sans SSR) et les wildcards `*.google*` (AdSense) sont assumés.
# Origines tierces réelles autorisées : jsDelivr (KaTeX), AdSense, Umami
# (stats.), remark42 (commentaires), ntfy (push), Google Tag Manager + GA4,
# EzoicAds (ezojs.com, *.ezoic.com/.net, ezoicanalytics.com) + CMP gatekeeper.
# ⚠️ Ezoic sert des créas depuis de nombreux domaines de demande : img-src 'https:'
#    couvre les images ; si des annonces en iframe ne s'affichent pas, élargir
#    frame-src (au pire `https:`). CSP + Ezoic = friction connue, ajuster au besoin.
# ─────────────────────────────────────────────────────────────────────────────

# ── En-têtes de sécurité (niveau server → sur TOUTES les réponses, y compris 301/404) ──
# `always` : indispensable pour accompagner aussi les réponses non-2xx.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.google.com https://*.gstatic.com https://stats.blogdungaucher.com https://cdn.jsdelivr.net https://remark42.blogdungaucher.com https://www.googletagmanager.com https://www.ezojs.com https://*.ezojs.com https://*.ezoic.com https://*.ezoic.net https://ezoicanalytics.com https://*.gatekeeperconsent.com; connect-src 'self' https://blogdungaucher.com https://stats.blogdungaucher.com https://*.google.com https://pagead2.googlesyndication.com https://remark42.blogdungaucher.com https://ntfy.blogdungaucher.com https://www.google-analytics.com https://*.ezoic.com https://*.ezoic.net https://*.ezojs.com https://ezoicanalytics.com https://*.gatekeeperconsent.com; frame-src https://*.google.com https://googleads.g.doubleclick.net https://remark42.blogdungaucher.com https://*.ezoic.com https://*.ezoic.net; form-action 'self' https://blogdungaucher.com; upgrade-insecure-requests" always;

# ── Cache-Control par type de ressource ──
# Valeur calculée par le `map $uri $blog_cache_control` de nginx-cache-map.conf
# (contexte http). Un seul add_header au niveau server → n'écrase pas les
# en-têtes de sécurité ci-dessus (contrairement à des `location` dédiés).
add_header Cache-Control $blog_cache_control always;
