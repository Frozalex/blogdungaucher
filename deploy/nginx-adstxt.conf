# ─────────────────────────────────────────────────────────────────────────────
# ads.txt → géré par Ezoic (AdsTxtManager) — blogdungaucher.com (nginx)
#
# POURQUOI : Ezoic (programme Incubator) exige un ads.txt listant les partenaires
# publicitaires autorisés. Plutôt qu'un fichier statique à maintenir à la main,
# Ezoic recommande une redirection 301 vers leur gestionnaire, qui garde la liste
# de vendeurs à jour côté serveur. ID AdsTxtManager du compte : 19390.
#
# Un `location = /ads.txt` (match EXACT) prime sur le service du fichier statique
# public/ads.txt : la redirection l'emporte toujours, quel que soit l'ordre des
# blocs. public/ads.txt (ligne AdSense) reste comme repli si ce snippet est retiré.
#
# DÉPLOIEMENT (manuel, une fois) — même server block que blog-headers/redirects :
#   1) scp deploy/nginx-adstxt.conf root@177.7.37.62:/etc/nginx/snippets/blog-adstxt.conf
#   2) dans le server block HTTPS, avec les autres include :
#        include /etc/nginx/snippets/blog-adstxt.conf;
#   3) nginx -t && systemctl reload nginx
#   4) Vérif :
#        curl -sI https://blogdungaucher.com/ads.txt | grep -i location
#          # attendu : Location: https://srv.adstxtmanager.com/19390/blogdungaucher.com  (301)
#        curl -sL https://blogdungaucher.com/ads.txt | head   # liste des vendeurs
# ─────────────────────────────────────────────────────────────────────────────

location = /ads.txt {
    return 301 https://srv.adstxtmanager.com/19390/blogdungaucher.com;
}
