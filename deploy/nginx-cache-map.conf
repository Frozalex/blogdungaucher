# ─────────────────────────────────────────────────────────────────────────────
# Politique de cache par type de ressource — blogdungaucher.com (nginx, CONTEXTE http)
#
# POURQUOI un `map` plutôt que des blocs `location` dédiés :
#   un `location` qui déclare son propre `add_header` ÉCRASE tous les en-têtes
#   hérités du niveau server (règle nginx sur l'héritage de add_header). Des
#   `location` de cache avec `add_header` supprimaient donc HSTS/CSP/X-Frame des
#   réponses concernées. Le `map` calcule seulement la valeur ; un unique
#   `add_header Cache-Control $blog_cache_control` au niveau server (voir
#   nginx-headers.conf) l'applique SANS casser l'héritage des en-têtes de sécurité.
#
# DÉPLOIEMENT : placer ce fichier en contexte http, p.ex.
#   /etc/nginx/conf.d/blog-cache-map.conf   (inclus par défaut dans le http {} de nginx)
# ─────────────────────────────────────────────────────────────────────────────
map $uri $blog_cache_control {
    default                                                                "public, max-age=0, must-revalidate";
    "~^/_astro/"                                                           "public, max-age=31536000, immutable";
    "~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf|mp4|webm)$" "public, max-age=2592000";
    "~^/(?:robots\.txt|sitemap\.xml|rss\.xml|manifest\.json)$"             "public, max-age=3600";
}
