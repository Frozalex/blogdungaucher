# ─────────────────────────────────────────────────────────────────────────────
# Vhost Nginx — remark42.blogdungaucher.com
#
# DÉPLOIEMENT (une fois sur le VPS) :
#   1. scp deploy/nginx-remark42.conf root@177.7.37.62:/etc/nginx/sites-available/remark42.conf
#   2. ln -s /etc/nginx/sites-available/remark42.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d remark42.blogdungaucher.com
#   5. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name remark42.blogdungaucher.com;

    # certbot ajoutera le redirect 443 ici automatiquement
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (compteur de commentaires en live)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 86400;
    }
}
