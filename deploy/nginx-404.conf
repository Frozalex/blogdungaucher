# ─────────────────────────────────────────────────────────────────────────────
# Vraie 404 HTTP — blogdungaucher.com (nginx, CONTEXTE server)
#
# LE BUG CORRIGÉ : toute URL inexistante renvoyait **HTTP 200** avec le stub de
# 473 octets de `dist/index.html` (la page de redirection de l'apex :
# `<title>Redirection…</title>`, meta-refresh vers /fr/, canonical vers /fr/).
# Cause : le `location /` du server block terminait son `try_files` par
# `/index.html` — le fallback SPA classique, qui n'a aucun sens pour un site
# statique multipage. Tout chemin non résolu retombait donc sur l'index.
#
# POURQUOI C'EST GRAVE (SEO) : c'est un soft-404. Google reçoit un 200 + un
# canonical vers /fr/ pour CHAQUE URL morte → indexation d'URL fantômes et
# dilution du budget de crawl. Cas le plus courant sur ce site : les articles à
# `publishDate` future, dont la page n'est pas générée (getStaticPaths filtre via
# getAllPosts(), src/utils/blog.ts:47) — leurs URL servaient ce stub au lieu
# d'une 404 franche.
#
# LE CORRECTIF : `=404` en dernier argument de try_files (au lieu de /index.html)
# + `error_page 404 /404.html` pour servir la vraie page 404 stylée générée par
# `npm run build` (dist/404.html, ~60 Ko) — avec le code HTTP 404 préservé.
#
# ⚠️ NE TOUCHE PAS à la redirection 301 de l'apex : `/` est capté en amont par le
#    `location = /  { return 301 /fr/; }` de nginx-redirects.conf. Un match exact
#    (`= /`) est prioritaire sur le préfixe `/` — l'apex ne passe jamais ici.
#
# DÉPLOIEMENT : ne pas copier ce fichier à la main, lancer en root sur le VPS
#   sudo bash /var/www/site/repo/deploy/activate-nginx-404.sh          # dry-run
#   sudo bash /var/www/site/repo/deploy/activate-nginx-404.sh --apply  # applique
#
# Ce fichier est la RÉFÉRENCE de l'état visé du server block ; le script patche
# le `location /` existant en place plutôt que de l'inclure (un `include` qui
# redéclare `location /` provoquerait un « duplicate location » avec celui déjà
# présent dans le server block).
# ─────────────────────────────────────────────────────────────────────────────

# ── État visé, à l'intérieur du server block HTTPS (listen 443) ──
#
#   root /var/www/site/public;
#   index index.html;
#
#   include /etc/nginx/snippets/blog-redirects.conf;   # 301 SEO + apex → /fr/
#   include /etc/nginx/snippets/blog-headers.conf;     # sécurité + Cache-Control
#
#   # Vraie 404 : la page stylée, avec le code HTTP 404 conservé.
#   # (nginx ne réécrit PAS le statut sur un error_page vers un fichier statique ;
#   #  il ne le ferait qu'avec la syntaxe explicite `error_page 404 =200 /404.html`.)
#   error_page 404 /404.html;
#
#   # `internal` : /404.html n'est atteignable que par redirection interne, pas
#   # en direct — évite une page 404 servie en 200 sur sa propre URL (soft-404 bis).
#   # Aucun add_header ici → le bloc hérite bien de ceux du niveau server.
#   location = /404.html {
#       internal;
#   }
#
#   location / {
#       # $uri      : fichier exact (/robots.txt, /_astro/xxx.css…)
#       # $uri/     : répertoire → index.html (trailingSlash: "always" côté Astro)
#       # =404      : ❗ LE FIX — plus de fallback vers /index.html
#       try_files $uri $uri/ =404;
#   }
#
# VÉRIFICATION APRÈS RECHARGE :
#   curl -sS -o /dev/null -w '%{http_code}\n' https://blogdungaucher.com/fr/
#     # attendu : 200
#   curl -sS -o /dev/null -w '%{http_code}\n' https://blogdungaucher.com/fr/blog/url-qui-nexiste-absolument-pas-xyz123/
#     # attendu : 404   (avant le fix : 200)
#   curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' https://blogdungaucher.com/
#     # attendu : 301 https://blogdungaucher.com/fr/
