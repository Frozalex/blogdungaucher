# ─────────────────────────────────────────────────────────────────────────────
# Compression + discrétion du serveur — blogdungaucher.com (nginx, CONTEXTE http)
#
# POURQUOI : l'audit du code source livré (24/09/2026) a relevé que SEUL le HTML
# sortait compressé. Ubuntu active bien `gzip on;` dans nginx.conf, mais laisse
# `gzip_types` à sa valeur par défaut — c'est-à-dire `text/html` uniquement.
# Tout le reste partait en clair. Mesuré en production ce jour-là :
#
#     /sitemap.xml                 134 957 o  →   ~14 000 o   (−90 %)
#     BaseLayout.css                58 959 o  →    10 925 o   (−81 %)
#     /blog-index/fr.json           47 114 o  →    13 268 o   (−72 %)
#     /rss.xml                      45 839 o  →     9 113 o   (−80 %)
#     Comments.css                  32 412 o  →     8 724 o   (−73 %)
#     _slug_@_@astro.css            18 751 o  →     3 796 o   (−80 %)
#     ClientRouter.js               13 617 o  →     4 731 o   (−65 %)
#     ── total des 10 assets /_astro/ d'une page d'article ──
#                                  164 737 o  →    39 169 o   (−77 %)
#
# Le même audit signalait `server: nginx/1.24.0 (Ubuntu)` dans les réponses :
# version exacte + distribution offertes à n'importe quel scanner. D'où le
# `server_tokens off;` ci-dessous, qui réduit l'en-tête à `server: nginx`.
#
# ⚠️ POURQUOI LE CONTEXTE http ET PAS server : `gzip_types` et `server_tokens`
# s'héritent vers les `server`/`location`, mais ne sont PAS cumulatifs — une
# redéclaration remplace la précédente. On les pose donc une seule fois, au plus
# haut niveau. Contrairement à nginx-headers.conf, aucun piège d'héritage
# d'`add_header` ici : `gzip_vary on;` fait émettre `Vary: Accept-Encoding` par
# le module gzip lui-même, sans passer par un `add_header` (qui aurait, lui,
# écrasé les en-têtes de sécurité du niveau server).
#
# ⚠️ ORDRE D'INCLUSION : dans le nginx.conf d'Ubuntu, `include conf.d/*.conf;`
# vient APRÈS le bloc `gzip on;` — ce fichier gagne donc sur les valeurs par
# défaut. Il n'y a rien à commenter dans nginx.conf.
#
# DÉPLOIEMENT (manuel, une fois) :
#   1) cp nginx-compression.conf /etc/nginx/conf.d/blog-compression.conf
#   2) nginx -t && systemctl reload nginx
#   3) Vérif — compression effective sur chaque type :
#        for u in /fr/ /sitemap.xml /rss.xml /blog-index/fr.json \
#                 /_astro/BaseLayout.B8uF2MOW.css /images/logo.svg; do
#          printf '%-42s ' "$u"
#          curl -sI -H 'Accept-Encoding: gzip' "https://blogdungaucher.com$u" \
#            | grep -iE '^(content-encoding|vary)' | tr -d '\r' | paste -sd' '
#        done
#      → attendu : `content-encoding: gzip` ET `vary: Accept-Encoding` partout.
#   4) Vérif — l'en-tête server ne dit plus la version :
#        curl -sI https://blogdungaucher.com/fr/ | grep -i '^server'
#      → attendu : `server: nginx` (sans « /1.24.0 (Ubuntu) »).
#   5) Contrôle anti-régression : s'assurer qu'aucun autre fichier inclus après
#      celui-ci ne repose `gzip_types` (l'ordre est alphabétique dans conf.d) :
#        grep -rn 'gzip_types\|server_tokens' /etc/nginx/ | grep -v '^\s*#'
# ─────────────────────────────────────────────────────────────────────────────

# ── Ne pas divulguer la version de nginx ni la distribution ──
# Vaut aussi pour les pages d'erreur générées par nginx (404/50x), qui affichent
# sinon « nginx/1.24.0 (Ubuntu) » en pied de page.
server_tokens off;

# ── Compression ──
# ⚠️ PAS de `gzip on;` ICI, et ce n'est pas un oubli. Le nginx.conf d'Ubuntu le
# pose déjà au niveau http, et nginx refuse la directive en double dans un même
# contexte — le répéter « pour être autoportant » fait échouer `nginx -t` avec :
#     [emerg] "gzip" directive is duplicate in .../blog-compression.conf:62
# (erreur rencontrée au déploiement du 24/09/2026). Contrairement à gzip_types,
# qui est une valeur remplaçable, `gzip` est un simple interrupteur non
# redéclarable. On s'appuie donc sur celui de nginx.conf : il est bien actif,
# c'est ce qui explique que le HTML sortait déjà compressé avant ce fichier.
# Si un jour le HTML cesse d'être gzippé, vérifier `grep -n 'gzip' /etc/nginx/nginx.conf`
# avant de rajouter quoi que ce soit ici.

# Indispensable dès qu'un proxy ou un CDN est devant : sans `Vary`, un cache
# intermédiaire peut resservir la réponse gzip à un client qui ne l'accepte pas.
gzip_vary on;

# 6 = palier habituel. Au-delà, le gain se compte en dizaines d'octets pour un
# coût CPU par requête bien réel, ces fichiers n'étant pas pré-compressés.
gzip_comp_level 6;

# En dessous de ~1 ko, l'en-tête gzip coûte plus que ce qu'il économise. Cela
# écarte au passage les deux bundles quasi vides d'Astro (40 o et 70 o), qui
# GROSSISSENT une fois compressés (→ 66 o et 91 o mesurés).
gzip_min_length 1024;

# Compresser aussi ce qui transite par un proxy (Cloudflare, cache amont…).
gzip_proxied any;

# ⚠️ `text/html` est TOUJOURS compressé et ne doit JAMAIS figurer ici : nginx
# refuserait la config avec « duplicate MIME type "text/html" » et `nginx -t`
# échouerait.
#
# Volontairement ABSENTS, car déjà compressés en interne — les repasser au gzip
# ne fait que brûler du CPU pour un gain nul ou négatif :
#   • woff2/woff (compression intégrée au format)
#   • png / jpeg / webp / avif / gif / mp4 / webm
#   • les artefacts Pagefind (*.pf_meta, *.pf_fragment, *.pf_index, *.pagefind) :
#     Pagefind livre ses fragments et son wasm déjà compressés.
# Leur exclusion est automatique : `gzip_types` est une liste blanche, et ces
# fichiers sortent en image/* ou en application/octet-stream.
#
# ⚠️ font/ttf et font/otf sont INERTES ici, et c'est assumé. Le mime.types livré
# avec nginx 1.24 ne mappe QUE woff, woff2 et eot — il n'a aucune entrée .ttf
# ni .otf (vérifié le 24/09/2026 dans l'image officielle). Ces fichiers tombent
# donc sur `default_type`, qui vaut `application/octet-stream` dans le nginx.conf
# d'Ubuntu : un type volontairement hors liste blanche, puisqu'il couvre aussi
# les artefacts Pagefind. Conséquence mesurée en production : les .ttf de
# dist/_astro/ partent non compressés (31 308 o là où gzip donnerait 19 130 o).
# C'est délibéré : ce sont les replis KaTeX pour navigateurs sans woff2, que plus
# aucun client moderne ne demande — les .woff2 équivalents sont servis à leur
# place. Les deux entrées ci-dessous n'attendent qu'un mime.types corrigé.
# Pour vraiment les compresser il faudrait remapper le type dans un
# `location ~ \.ttf$` du bloc server (impossible ici : `location` est interdit
# en contexte http) — gain quasi nul, complexité réelle, donc écarté.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf;
