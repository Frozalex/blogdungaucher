name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # SSH en clair (pas appleboy) pour pouvoir : (1) FORCER l'IPv4 via `ssh -4` — les runners
      # GitHub sont IPv4-only, et le serveur ayant une AAAA, une résolution IPv6 causait des
      # « dial tcp :22 i/o timeout » aléatoires ; (2) RÉESSAYER — la route Azure→VPS est instable
      # (≈1 connexion sur 5 aboutit), donc on retente jusqu'à 6 fois.
      - name: Deploy via SSH (IPv4 forcé + retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 16
          max_attempts: 6
          retry_wait_seconds: 25
          command: |
            mkdir -p ~/.ssh
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh -4 -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=45 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              '/usr/local/bin/deploy-site.sh'

      - name: Détecter nouvel article
        if: success()
        id: detect
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Pas d'historique git suffisant"
            echo "new_article=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONTENT_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^src/content/blog/' | grep '\.md$' || true)
          if [ -z "$CONTENT_FILES" ]; then
            echo "Pas de nouvel article (blog)"
            echo "new_article=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARGET=$(echo "$CONTENT_FILES" | sort | head -1)
          SLUG=$(basename "$TARGET" .md)
          TITLE=$(awk '/^---$/{d++;if(d>=2)exit;next}d==1&&/^title:/{line=$0;sub(/^title:[[:space:]]+/,"",line);if(line~/^".*"$/){line=substr(line,2,length(line)-2)}print line;exit}' "$TARGET")
          [ -z "$TITLE" ] && TITLE="Nouvel article"
          echo "new_article=$TARGET" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Push notification (ntfy)
        if: success() && steps.detect.outputs.new_article != ''
        env:
          NTFY_URL:   ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ARTICLE_TITLE: ${{ steps.detect.outputs.title }}
          ARTICLE_SLUG:  ${{ steps.detect.outputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ] || [ -z "${NTFY_TOKEN:-}" ]; then
            echo "NTFY_URL ou NTFY_TOKEN absent ; notification ignorée."
            exit 0
          fi
          TOPIC="${NTFY_TOPIC:-blog-gaucher}"
          curl -sS -f -X POST "${NTFY_URL}/${TOPIC}" \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: ${ARTICLE_TITLE}" \
            -H "Click: https://blogdungaucher.com/fr/blog/${ARTICLE_SLUG}/" \
            -H "Tags: chess,left_fist" \
            -d "Nouvel article publié sur Blog d'un Gaucher"

      - name: Programmer email newsletter (Brevo, H+1)
        if: success() && steps.detect.outputs.new_article != ''
        env:
          BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID:      ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME:  ${{ secrets.BREVO_SENDER_NAME }}
          SITE_URL:           https://blogdungaucher.com
          SEND_DELAY_MINUTES: "60"
        run: |
          set -euo pipefail
          if [ -z "${BREVO_API_KEY:-}" ] || [ -z "${BREVO_SENDER_EMAIL:-}" ]; then
            echo "BREVO_API_KEY ou BREVO_SENDER_EMAIL absent ; newsletter ignorée."
            exit 0
          fi
          node scripts/send-new-article-email.mjs "${{ steps.detect.outputs.new_article }}"
