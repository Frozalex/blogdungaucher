# ─────────────────────────────────────────────────────────────
# Notification ntfy + Web Push "nouvel article"  -  Blog d'un Gaucher
# ─────────────────────────────────────────────────────────────
#
# Envoie une notification ntfy/Web Push QUAND un article passe en ligne
# (publishDate ≤ now), et non quand il est commité. Auparavant la notif
# partait au push (deploy.yml), donc des mois trop tôt pour les articles
# rédigés en avance — et jamais le jour J pour les triggers de
# scheduled-publish.yml qui ne touchent pas src/content/blog/.
#
# Tourne juste après le cron de publication (même offset que newsletter.yml),
# le temps que le VPS ait tiré et rebuild (cron auto-deploy-poll.sh, 2 min).
#
# Anti-doublon : deploy/ntfy-sent.json (committé) mémorise les slugs déjà
# notifiés, cf. deploy/newsletter-sent.json.
# ─────────────────────────────────────────────────────────────

name: Notification nouvel article (ntfy)

on:
  schedule:
    # ~15 min après le cron de publication (filet de sécurité quotidien)
    - cron: "15 6 * * *"
    # Lundi, mardi (série) et jeudi, ~15 min après la publication
    - cron: "15 7 * * 1,2,4"
  workflow_dispatch:

concurrency:
  group: ntfy-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Notifier les articles fraîchement publiés
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Volontairement SANS continue-on-error. La version précédente combinait
      # un `exit 0` silencieux (secret absent) avec continue-on-error : le job
      # affichait « success » alors qu'il n'avait rien envoyé, et le problème
      # est resté invisible plusieurs jours. Un échec doit être rouge.
      - name: Notifier (ntfy + Web Push)
        env:
          NTFY_URL:        ${{ secrets.NTFY_URL }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN:      ${{ secrets.NTFY_TOKEN }}
          PUSH_PROXY_URL:  ${{ secrets.PUSH_PROXY_URL }}
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ]; then
            echo "::error title=Secret manquant::NTFY_URL n'est pas configuré dans les secrets du dépôt — aucune notification ne peut partir."
            exit 1
          fi
          node scripts/notify-ntfy.mjs

      # if: always() — si l'envoi a réussi pour 3 articles puis échoué sur le 4e,
      # l'état des 3 est déjà écrit sur disque et DOIT être persisté, sinon ils
      # seraient re-notifiés au prochain run.
      - name: Commiter l'état (si changé)
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/ntfy-sent.json
          if git diff --cached --quiet; then
            echo "État inchangé — rien à committer."
            exit 0
          fi
          git commit -m "chore(ntfy): maj état d'envoi $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci-notify]"

          # newsletter.yml pousse sur main dans la même fenêtre horaire : un push
          # rejeté perdrait l'état et provoquerait des notifications en double.
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "État poussé (tentative $i)."
              exit 0
            fi
            echo "Push rejeté (tentative $i) — rebase sur origin/main puis nouvel essai."
            git pull --rebase --autostash origin main || true   # set -e ne doit pas avorter la boucle
            sleep $(( i * 5 ))
          done
          echo "::error title=Push impossible::Impossible de pousser deploy/ntfy-sent.json après 5 tentatives ; risque de notifications en double au prochain run."
          exit 1
