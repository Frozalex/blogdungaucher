# ─────────────────────────────────────────────────────────────
# Publication automatique différée  -  Blog d'un Gaucher
# ─────────────────────────────────────────────────────────────
#
# Déclenche chaque matin à 06h00 UTC (08h00 Paris) et les
# jours de publication habituels (lun + jeu) à 07h00 UTC.
#
# MÉCANISME (pull-based, sans SSH) :
#   1. Ce workflow pousse un micro-commit sur main qui met à
#      jour deploy/scheduled-trigger.txt (date du jour).
#   2. Le cron VPS (auto-deploy-poll.sh, toutes les 2 min)
#      détecte le nouveau commit → lance deploy-site.sh.
#   3. Astro reconstruit ; les articles dont publishDate ≤ now
#      apparaissent automatiquement.
#
# Pas de secrets SSH requis — seul GITHUB_TOKEN (natif) est utilisé.
# ─────────────────────────────────────────────────────────────

name: Publication automatique

on:
  schedule:
    # Tous les jours à 06h00 UTC (filet de sécurité)
    - cron: "0 6 * * *"
    # Jours de publication à 07h00 UTC : lundi et jeudi pour la file générale,
    # mardi pour la série éditoriale. Cf. docs/10-publication-planning.md.
    - cron: "0 7 * * 1,2,4"
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Déclencher le déploiement (commit trigger)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token avec droit d'écriture pour pouvoir pusher
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Créer le commit de trigger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Met à jour le fichier de timestamp (idempotent)
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > deploy/scheduled-trigger.txt

          git add deploy/scheduled-trigger.txt

          # N'écrit un commit que si quelque chose a changé
          if git diff --cached --quiet; then
            echo "Aucun changement — le VPS est déjà à jour."
            exit 0
          fi

          git commit -m "chore(deploy): scheduled trigger $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci-notify]"
          git push origin main

      - name: Résumé
        run: |
          echo "### Trigger envoyé" >> "$GITHUB_STEP_SUMMARY"
          echo "Le VPS détectera ce commit dans les 2 minutes et déclenchera un rebuild." >> "$GITHUB_STEP_SUMMARY"
          echo "Les articles dont \`publishDate\` est passée seront désormais en ligne." >> "$GITHUB_STEP_SUMMARY"
